---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
        UNIFI_MCP_HTTP_AUTH_TOKEN: "{{ .UNIFI_MCP_TOKEN }}"
        UNIFI_USERNAME: "{{ .UNIFI_MCP_USERNAME }}"
        UNIFI_PASSWORD: "{{ .UNIFI_MCP_PASSWORD }}"
  dataFrom:
    - extract:
        key: unifi-mcp
