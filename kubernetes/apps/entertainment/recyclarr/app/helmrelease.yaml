---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: recyclarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/recyclarr/recyclarr
      tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
    apiKey:
      existingSecret: recyclarr-secret
      existingSecretKey: RECYCLARR_API_KEY
    configs:
      existingConfigMap: recyclarr-configs
    settings:
      existingConfigMap: recyclarr-settings
    env:
      - name: TZ
        value: America/Los_Angeles
    envFrom:
      - secretRef:
          name: recyclarr-secret
    extraVolumes:
      - name: custom-formats
        configMap:
          name: recyclarr-custom-formats
          items:
            - key: banned-releases-sonarr.json
              path: sonarr/banned-releases.json
            - key: banned-releases-radarr.json
              path: radarr/banned-releases.json
    extraVolumeMounts:
      - name: custom-formats
        mountPath: /config/custom-formats
        readOnly: true
    persistence:
      state:
        existingClaim: recyclarr-zfs
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
