---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./pvc-zfs.yaml
configMapGenerator:
  - name: recyclarr-configs
    files:
      - recyclarr.yml=./resources/recyclarr.yml
  - name: recyclarr-settings
    files:
      - settings.yml=./resources/settings.yml
  - name: recyclarr-custom-formats
    files:
      - banned-releases-sonarr.json=./resources/banned-releases-sonarr.json
      - banned-releases-radarr.json=./resources/banned-releases-radarr.json
generatorOptions:
  disableNameSuffixHash: true
